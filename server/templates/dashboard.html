<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPC Manager - AI Cluster</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: {
                            750: '#2d3748',
                            850: '#1a202c',
                            950: '#0d1117',
                        }
                    }
                }
            }
        }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { background-color: #0f172a; color: #e2e8f0; }
        .card-enter { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></div>
            <h1 class="text-xl font-bold tracking-wide text-white">RPC <span class="text-blue-500">Manager</span></h1>
        </div>
        <div class="text-sm text-gray-400">
            Cluster Status: <span class="text-green-400 font-semibold">Active</span>
        </div>
    </nav>

    <main class="flex-grow p-6">

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mt-6">

            <div class="flex flex-col gap-4">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <span>🖥️</span> Cluster Nodes
                </h2>

                <div id="node-grid" class="grid grid-cols-1 gap-6">
                    </div>

                <div id="empty-state" class="hidden flex flex-col items-center justify-center h-64 text-gray-500 border border-dashed border-gray-700 rounded-lg">
                    <svg class="w-16 h-16 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    <p class="text-lg">Waiting for nodes...</p>
                </div>
            </div>

            <div class="flex flex-col gap-4">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <span>⚙️</span> Orchestrator Settings
                </h2>

                <div class="bg-gray-800 rounded-lg p-4 shadow-lg flex flex-col gap-6">

                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Models Directory</label>
                        <div class="flex gap-2">
                            <input type="text" id="models-path-input"
                                   class="bg-gray-900 border border-gray-700 text-white p-2 rounded flex-grow text-sm focus:ring-blue-500 focus:border-blue-500"
                                   placeholder="e.g. F:\lmstudio\models">
                            <button id="scan-models-btn" onclick="saveConfigAndScan()"
                                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded text-sm transition-colors whitespace-nowrap">
                                Scan
                            </button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Select Model (.gguf)</label>
                        <select id="main-model-select" class="bg-gray-900 border border-gray-700 text-white p-2 rounded w-full text-sm focus:ring-blue-500 focus:border-blue-500">
                            <option value="" disabled selected>No models found (configure path first)</option>
                        </select>
                    </div>

                    <div class="bg-gray-900/50 border border-gray-700 rounded-lg p-4">
                        <h3 class="text-sm font-bold text-gray-300 mb-3">Launch Parameters</h3>

                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <div class="col-span-2 flex gap-2 items-end">
                                <div class="flex-grow">
                                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Preset</label>
                                    <select id="preset-select" class="bg-gray-800 border border-gray-600 text-white p-2 rounded w-full text-sm focus:ring-blue-500 focus:border-blue-500">
                                        <option value="Default">Default</option>
                                    </select>
                                </div>
                            </div>

                            <div class="col-span-2">
                                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Save as New Preset</label>
                                <div class="flex gap-2">
                                    <input type="text" id="new-preset-name" class="bg-gray-800 border border-gray-600 text-white p-2 rounded flex-grow text-sm" placeholder="Preset Name">
                                    <button onclick="saveCurrentPreset()" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded text-sm transition-colors">Save</button>
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Context (-c)</label>
                                <input type="number" id="param-c" value="32768" class="bg-gray-800 border border-gray-600 text-white p-2 rounded w-full text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">GPU Layers (-ngl)</label>
                                <input type="number" id="param-ngl" value="99" class="bg-gray-800 border border-gray-600 text-white p-2 rounded w-full text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Cache K</label>
                                <select id="param-cache-k" class="bg-gray-800 border border-gray-600 text-white p-2 rounded w-full text-sm">
                                    <option value="f16">f16</option>
                                    <option value="q8_0">q8_0</option>
                                    <option value="q4_0">q4_0</option>
                                    <option value="q4_1">q4_1</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Cache V</label>
                                <select id="param-cache-v" class="bg-gray-800 border border-gray-600 text-white p-2 rounded w-full text-sm">
                                    <option value="f16">f16</option>
                                    <option value="q8_0">q8_0</option>
                                    <option value="q4_0">q4_0</option>
                                    <option value="q4_1">q4_1</option>
                                </select>
                            </div>

                            <div class="col-span-2 flex flex-wrap items-center gap-4 mt-2">
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="checkbox" id="param-fa" checked class="w-4 h-4 text-blue-600 bg-gray-800 border-gray-600 rounded focus:ring-blue-500">
                                    <span class="text-xs font-medium text-gray-300">Flash Attn</span>
                                </label>
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="checkbox" id="param-mmap" checked class="w-4 h-4 text-blue-600 bg-gray-800 border-gray-600 rounded focus:ring-blue-500">
                                    <span class="text-xs font-medium text-gray-300">No Mmap</span>
                                </label>
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="checkbox" id="param-disable-local" class="w-4 h-4 text-blue-600 bg-gray-800 border-gray-600 rounded focus:ring-blue-500">
                                    <span class="text-xs font-medium text-blue-400">Disable Local GPU (RPC Only)</span>
                                </label>
                            </div>

                            <div class="col-span-2 mt-2">
                                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Fit (--fit)</label>
                                <input type="text" id="param-fit" class="bg-gray-800 border border-gray-600 text-white p-2 rounded w-full text-sm" placeholder="e.g. 0.5">
                            </div>
                            <div class="col-span-2">
                                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Custom Args</label>
                                <input type="text" id="param-custom" class="bg-gray-800 border border-gray-600 text-white p-2 rounded w-full text-sm" placeholder="e.g. --threads 8">
                            </div>
                        </div>
                    </div>

                    <div>
                        <div class="flex gap-4 mb-2">
                            <div class="flex-grow">
                                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Orchestrator Version</label>
                                <select id="main-version-select" class="bg-gray-900 border border-gray-700 text-white p-2 rounded w-full text-sm focus:ring-blue-500 focus:border-blue-500">
                                    <option disabled selected>Loading...</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Port</label>
                                <input type="number" id="orchestrator-port-input" value="8080" class="bg-gray-900 border border-gray-700 text-white p-2 rounded w-20 text-sm focus:ring-blue-500 focus:border-blue-500">
                            </div>
                        </div>
                        <div class="flex gap-2">
                             <button id="server-install-btn" onclick="installServerVersion()"
                                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded text-sm transition-colors w-full">
                                Install / Update Binary
                            </button>
                        </div>

                        <div id="server-download-log" class="hidden mt-2 bg-black text-green-400 font-mono text-xs p-2 rounded h-24 overflow-y-auto border border-gray-700">
                            <span id="server-download-text">Waiting for logs...</span>
                        </div>
                    </div>

                </div>
            </div>

            <div class="flex flex-col gap-4">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <span>▶️</span> Terminal & Controls
                </h2>

                <div id="orchestrator-status-indicator" class="mb-2 flex justify-between items-center">
                    <div>
                        <span class="text-sm font-bold text-gray-400">Status:</span>
                        <span id="orchestrator-status-text" class="text-gray-500 font-mono">Stopped</span>
                    </div>
                        <button onclick="copyAllLogs()" id="btn-copy-logs" class="text-xs bg-gray-700 hover:bg-gray-600 text-gray-300 px-3 py-1 rounded transition-colors flex items-center gap-1 border border-gray-600">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        Copy Logs
                    </button>
                </div>
                <div class="bg-gray-800 rounded-lg p-4 shadow-lg flex flex-col h-[650px]"> <div id="orchestrator-status-indicator" class="mb-2 flex justify-between items-center">
                        <span class="text-sm font-bold text-gray-400">Status:</span>
                        <span id="orchestrator-status-text" class="text-gray-500 font-mono">Stopped</span>
                    </div>

                    <div id="orchestrator-logs" class="bg-black text-green-400 font-mono text-xs p-3 rounded flex-grow overflow-y-auto whitespace-pre-wrap select-text border border-gray-700" style="display: block;">Waiting for server to start...</div>

                    <div class="grid grid-cols-2 gap-4 mt-4">
                        <button onclick="startOrchestrator()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded transition-colors shadow-lg flex justify-center items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Start Cluster
                        </button>
                        <button onclick="stopOrchestrator()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded transition-colors shadow-lg flex justify-center items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path></svg>
                            Stop Cluster
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <template id="node-card-template">
        <div class="bg-gray-800 rounded-xl border border-gray-700 shadow-xl overflow-hidden card-enter flex flex-col">
            <div class="bg-gray-750 px-5 py-3 border-b border-gray-700 flex justify-between items-center">
                <div>
                    <div class="flex items-center gap-3">
                        <h2 class="text-lg font-bold text-white node-hostname">Node Name</h2>
                        <label class="relative inline-flex items-center cursor-pointer" title="Include in Cluster">
                            <input type="checkbox" class="sr-only peer node-enable-toggle" checked>
                            <div class="w-8 h-4 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-blue-600"></div>
                        </label>
                    </div>
                    <p class="text-xs text-gray-400 node-ip">192.168.1.X</p>
                </div>
                <span class="px-2 py-1 rounded text-xs font-bold uppercase tracking-wider node-status bg-gray-600 text-gray-200">
                    Connecting...
                </span>
            </div>

            <div class="p-5 flex-grow">
                <div class="grid grid-cols-2 gap-y-2 gap-x-4 text-sm mb-4">
                    <div class="flex justify-between"><span class="text-gray-400">CPU Load:</span><span class="font-mono text-blue-400 node-cpu-val">0%</span></div>
                    <div class="flex justify-between"><span class="text-gray-400">RAM:</span><span class="font-mono text-purple-400 node-ram-val">0/0 GB</span></div>
                    <div class="flex justify-between col-span-2 border-t border-gray-700 pt-2 mt-1"><span class="text-gray-400">GPU:</span><span class="font-mono text-green-400 node-gpu-name text-xs text-right truncate ml-2">N/A</span></div>
                    <div class="flex justify-between col-span-2"><span class="text-gray-400">VRAM:</span><span class="font-mono text-green-400 node-vram-val">0/0 GB</span></div>
                    <div class="flex justify-between col-span-2"><span class="text-gray-400">Temp:</span><span class="font-mono text-red-400 node-gpu-temp">0°C</span></div>
                </div>
                <div class="relative h-32 w-full bg-gray-900/50 rounded-lg p-2 border border-gray-700/50 mb-4"><canvas class="node-chart"></canvas></div>
                <div class="flex flex-col gap-2">
                    <div class="flex items-center">
                        <select class="select-version bg-gray-900 border border-gray-700 text-white p-2 rounded-l flex-grow text-xs focus:ring-blue-500 focus:border-blue-500"><option disabled selected>Loading releases...</option></select>
                        <button class="btn-apply-update bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-r text-xs transition-colors">Apply</button>
                    </div>
                    <div class="node-console hidden bg-black text-green-400 font-mono text-xs p-2 rounded h-24 overflow-y-auto border border-gray-700"><span class="node-console-text">Waiting for logs...</span></div>
                </div>
            </div>

            <div class="bg-gray-900 px-5 py-3 border-t border-gray-800 text-xs flex flex-col gap-2">
                <div class="flex justify-between items-center"><span class="text-gray-500 font-bold">RPC Server:</span><span class="node-rpc-status text-gray-300">Stopped</span></div>
                <div class="flex gap-2 items-center mt-1">
                    <input type="number" class="node-rpc-port bg-gray-800 border border-gray-700 text-white p-1 rounded w-20 text-center" value="50052" placeholder="Port">
                    <button class="btn-start-rpc bg-green-600 hover:bg-green-700 text-white font-bold py-1 px-3 rounded flex-grow transition-colors">Start</button>
                    <button class="btn-stop-rpc bg-red-600 hover:bg-red-700 text-white font-bold py-1 px-3 rounded flex-grow transition-colors hidden">Stop</button>
                </div>
            </div>
        </div>
    </template>
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
